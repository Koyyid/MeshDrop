name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          SIGNALING_URL: ${{ vars.MESHDROP_SIGNALING_URL }}
        run: |
          mkdir -p _site/shared
          cp -R client/. _site/
          cp shared/protocol.js _site/shared/protocol.js
          printf 'globalThis.MESHDROP_CONFIG = Object.freeze({ signalingUrl: %s });\n' "$(jq -Rn --arg url "$SIGNALING_URL" '$url')" > _site/runtime-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
